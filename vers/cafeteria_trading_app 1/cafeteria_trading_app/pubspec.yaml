name: cafeteria_trading_app
description: Frontend estilo trading para cafetería (proyecto de pasantías).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fl_chart: ^0.66.0
  provider: ^6.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/carta/
    - assets/images/
