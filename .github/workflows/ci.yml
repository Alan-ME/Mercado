name: SMCTA CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: implementation/package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Build shared
        run: npm run build:shared

      - name: Type-check backend
        run: npm run build --workspace @smcta/backend

      - name: Pruebas unitarias + integración (Vitest, QA-01..04)
        run: npm run test --workspace @smcta/backend

      - name: Suite E2E (Playwright, QA Checklist)
        run: npm run test --workspace @smcta/e2e
